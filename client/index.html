    <meta name="description" content="Riiju Jagetiya — Full Stack .NET Developer & AI Integration Engineer based in Mumbai, India." />
    <title>Riiju Jagetiya | Full Stack .NET Developer & AI Integration Engineer</title>
    <script>
      // Keep VALID_THEMES in sync with THEMES in src/context/ThemeContext.jsx.
      (function () {
        var VALID_THEMES = ['dark', 'neon-green'];
        var stored = null;
        try {
          stored = localStorage.getItem('portfolio-theme');
        } catch (e) {
          /* localStorage unavailable — fall through to default */
        }
        var theme = VALID_THEMES.indexOf(stored) !== -1 ? stored : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

  </body>
